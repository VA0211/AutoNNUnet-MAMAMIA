seed: 42
fold: 4
device: cuda
load: null
save: null
pipeline:
  return_if_done: false
  run_training: true
  run_validation: true
  validate_with_best: true
  continue_training: true
  remove_validation_files: true
trainer:
  configuration: 3d_fullres
  fold: ${fold}
  plans_identifier: nnUNetPlans
  pretrained_weights_file: null
  use_compressed_data: true
  export_validation_probabilities: false
  disable_checkpointing: false
hp_config:
  num_epochs: 300
  total_epochs: 300
  optimizer: SGD
  momentum: 0.99
  initial_lr: 0.01
  weight_decay: 3.0e-05
  lr_scheduler: PolyLRScheduler
  oversample_foreground_percent: 0.33
  loss_function: DiceAndCrossEntropyLoss
  aug_factor: 1.0
  aug_scale_prob: 0.2
  aug_rotate_prob: 0.2
  aug_gaussian_noise_prob: 0.1
  aug_gaussian_blur_prob: 0.2
  aug_brightness_prob: 0.15
  aug_contrast_prob: 0.15
  aug_lowres_prob: 0.25
  aug_gamma_1_prob: 0.1
  aug_gamma_2_prob: 0.3
  encoder_type: ResidualEncoderL
  base_num_features: 32
  max_features: 320
  activation: LeakyReLU
  dropout_rate: 0.0
  model_scale: 1
  normalization: InstanceNorm
cluster: {}
dataset:
  _target_: autonnunet.datasets.msd_dataset.MSDDataset
  name: Dataset501_MAMAMIA
  modality: MR
  runtime_min: 905
  runtime_min_nas: 4000
  default_n_stages: 6
